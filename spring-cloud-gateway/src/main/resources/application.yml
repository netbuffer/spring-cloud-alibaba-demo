server:
  port: 8709

spring:
  application:
    name: spring-cloud-gateway
  cloud:
    sentinel:
      enabled: true
      eager: true
      filter:
        enabled: false
      transport:
        dashboard: 127.0.0.1:8800
        port: 8802
    nacos:
      discovery:
        server-addr: ${SCAD_GW_NACOS_ADDR:127.0.0.1:8848}
        namespace: ${SCAD_GW_NACOS_NS:3f21b39c-8476-4520-ac89-3ea4c0e1f47b}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service-provider
              uri: lb://user-service-provider
              predicates:
                - Path=/scadusp/**
              filters:
                - StripPrefix=1
                - LogRequestTime
            - id: user-service-invoker
              uri: lb://user-service-invoker
              predicates:
                - Path=/scadusi/**
              filters:
                - StripPrefix=1
                # 5.x 起 X-Forwarded-* 头默认被 RemoveXForwardedHeadersFilter 剥离，
                # 演示网关注入请求头改用自定义头（如需恢复 x-forwarded 需配 trusted-proxies）
                - AddRequestHeader=X-Gateway-Source, spring-cloud-gateway
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/scados/**
              filters:
                - StripPrefix=1
            - id: baidu_route
              uri: http://www.baidu.com
              predicates:
                - Header=X-Request-bd-id, \d+
              filters:
                - RemoveRequestHeader=X-Request-bd-id
                - AddResponseHeader=X-Response-From, bd
            - id: taobao_route
              uri: http://www.taobao.com
              predicates:
                - Token=x-user-type, \w+
              filters:
                - SetStatus=400

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  config: classpath:logback-springboot.xml

print-server-address:
  ignore-parent-context: true

info:
  app: ${spring.application.name}