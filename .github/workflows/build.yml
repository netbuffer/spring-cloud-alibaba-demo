name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  build:
    name: Build with Dragonwell 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dragonwell JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'dragonwell'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests --batch-mode

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spring-cloud-alibaba-demo-jars
          path: |
            order-service/target/order-service.jar
            spring-cloud-gateway/target/spring-cloud-gateway.jar
            user-service-invoker/target/user-service-invoker.jar
            user-service-provider/target/user-service-provider.jar
          retention-days: 30

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: spring-cloud-alibaba-demo-jars
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./dist/order-service.jar
            ./dist/spring-cloud-gateway.jar
            ./dist/user-service-invoker.jar
            ./dist/user-service-provider.jar
          generate_release_notes: true

  docker:
    name: Publish Docker image
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: spring-cloud-alibaba-demo-jars

      - name: Inspect and restore target artifacts
        run: |
          echo "Current directory contents:"
          pwd
          ls -laR
          # upload-artifact 在保留目录层级或者扁平放置时自动兼容
          mkdir -p order-service/target spring-cloud-gateway/target user-service-invoker/target user-service-provider/target
          find . -name "order-service.jar" -exec cp {} order-service/target/ \;
          find . -name "spring-cloud-gateway.jar" -exec cp {} spring-cloud-gateway/target/ \;
          find . -name "user-service-invoker.jar" -exec cp {} user-service-invoker/target/ \;
          find . -name "user-service-provider.jar" -exec cp {} user-service-provider/target/ \;
          echo "Target jars restored:"
          ls -la */target/*.jar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: "${{ env.DOCKERHUB_USER != '' && env.DOCKERHUB_PASS != '' }}"
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image version & tags
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          TAGS="ghcr.io/${{ github.repository }}:${VERSION},ghcr.io/${{ github.repository }}:latest"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            TAGS="${TAGS},javawiki/spring-cloud-alibaba-demo:${VERSION},javawiki/spring-cloud-alibaba-demo:latest"
          fi
          echo "TAGS=${TAGS}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
