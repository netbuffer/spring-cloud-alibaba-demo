services:
  scad-nacos:
    image: nacos/nacos-server:v3.2.3
    hostname: scad-nacos
    container_name: scad-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # 3.x镜像要求必须提供Base64令牌(>=32字符)，即使关闭鉴权
      NACOS_AUTH_TOKEN: U0NBRC1kZW1vLXNlY3JldC1rZXktMDEyMzQ1Njc4OS0yMDI2
      NACOS_AUTH_IDENTITY_KEY: scadIdentity
      NACOS_AUTH_IDENTITY_VALUE: scadValue
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v3/admin/core/state || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  scad-sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.9
    hostname: scad-sentinel-dashboard
    container_name: scad-sentinel-dashboard
    ports:
      - "8800:8858"
    restart: "no"
    environment:
      TZ: Asia/Shanghai
  scad-app:
    build: .
    image: javawiki/spring-cloud-alibaba-demo:v2.0.0
    hostname: scad-app
    container_name: scad-app
    ports:
      - "8702:8702"
      - "8709:8709"
      - "8701:8701"
      - "8700:8700"
    restart: "no"
    depends_on:
      scad-nacos:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SCAD_OS_NACOS_ADDR: scad-nacos:8848
      SCAD_OS_NACOS_NS: public
      SCAD_GW_NACOS_ADDR: scad-nacos:8848
      SCAD_GW_NACOS_NS: public
      SCAD_USI_NACOS_ADDR: scad-nacos:8848
      SCAD_USI_NACOS_NS: public
      SCAD_USP_NACOS_ADDR: scad-nacos:8848
      SCAD_USP_NACOS_NS: public
